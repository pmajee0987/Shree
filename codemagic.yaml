# Codemagic CI/CD Configuration for Shree App
workflows:
  web-app:
    name: Shree Web App Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 20
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
        - pattern: 'master'
    scripts:
      - name: Install dependencies
        script: |
          rm -f package-lock.json
          npm install --include=optional
          npm install --no-save @rollup/rollup-darwin-arm64 @esbuild/darwin-arm64
      - name: Type check and lint
        script: |
          npm run lint
      - name: Build Web Application
        script: |
          npm run build
    artifacts:
      - dist/**

  android-app:
    name: Shree Android APK Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          rm -f package-lock.json
          npm install --include=optional
          npm install --no-save @rollup/rollup-darwin-arm64 @esbuild/darwin-arm64
      - name: Build Web Bundle
        script: |
          npm run build
      - name: Build Android APK (Capacitor)
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - dist/**
      - android/app/build/outputs/apk/**/*.apk
